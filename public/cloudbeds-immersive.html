<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Reservas Casa Olivea</title>

    <!-- Fonts for embedded UI -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Cloudbeds Immersive Experience 2.0 -->
    <script
      src="https://static1.cloudbeds.com/booking-engine/latest/static/js/immersive-experience/cb-immersive-experience.js"
      type="text/javascript"
      defer
    ></script>

    <style>
      :root {
        --olivea-cream: #e7eae1;
        --olivea-ink: #5e7658;
        --olivea-olive: #5e7658;
        --olivea-panel: #f1f1f1;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: var(--olivea-cream);
        font-family: "Lora", serif;
        letter-spacing: 0.15px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .olivea-shell {
        width: 100%;
        min-height: 100%;
        background: var(--olivea-cream);
      }

      .root {
        width: 100%;
        min-height: 100%;
        display: flex;
      }

      cb-immersive-experience {
        display: block;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: transparent;
        animation: olivea-fade-in 600ms ease-out 60ms both;
      }

      /* ─────────────────────────────────────────────
         TEXT COLOR + TYPOGRAPHY (NO BUTTONS)
      ───────────────────────────────────────────── */
      .olivea-shell
        :is(
          #cb-bookingengine,
          .cb-bookingengine-root,
          cb-immersive-experience,
          reach-portal
        )
        :where(p, span, li, label, a, div.cb-text, strong, em, small, h1, h2, h3, h4, h5, h6) {
        color: var(--olivea-ink) !important;
        font-family: "Lora", serif !important;
        letter-spacing: 0.15px;
      }

      /* Larger, modern reading size */
      .olivea-shell
        :is(
          #cb-bookingengine,
          .cb-bookingengine-root,
          cb-immersive-experience,
          reach-portal
        )
        :where(p, li, label, div.cb-text, span) {
        font-size: 1.06rem !important; /* ~17px */
        line-height: 1.6 !important;
      }

      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        :where(h1, h2, h3, h4, h5) {
        font-weight: 500 !important;
        font-size: clamp(1.25rem, 1.4vw, 1.5rem) !important;
        line-height: 1.3 !important;
      }

      /* ─────────────────────────────────────────────
         BUTTON TEXT — never repaint it.

         The colour/size rules above target p/span/label/div, which also
         match the text nodes *inside* Cloudbeds' own buttons. Cloudbeds
         ships those buttons with an olive background and a light label, so
         forcing --olivea-ink on the label produced olive-on-olive: the
         checkout CTA ("Reservar" / "Continuar") rendered as a blank pill.
         Reset to `inherit` so the label follows the button's own colour.

         Must stay ABOVE the CTA section — those rules match with equal
         specificity, so source order decides and their explicit cream wins.
      ───────────────────────────────────────────── */
      .olivea-shell
        :is(
          #cb-bookingengine,
          .cb-bookingengine-root,
          cb-immersive-experience,
          reach-portal
        )
        :is(button, [role="button"], a.cb-button)
        :where(p, span, li, label, a, div.cb-text, strong, em, small, h1, h2, h3, h4, h5, h6) {
        color: inherit !important;
        font-size: inherit !important;
        line-height: inherit !important;
      }

      /* ─────────────────────────────────────────────
         UI HEADER / PROPERTY NAME → Jakarta Sans
         (Casa Olivea label)
      ───────────────────────────────────────────── */
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        p.cb-title-text,
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        p.cb-property-name {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif !important;
        font-weight: 600 !important; /* matches font-bold feel */
        letter-spacing: 0.02em !important;
        font-size: clamp(0.9rem, 2vw, 1.15rem) !important;
        line-height: 1.25 !important;
        margin: 0 !important;
      }

      /* ─────────────────────────────────────────────
         Cards
      ───────────────────────────────────────────── */
      .olivea-shell :is(#cb-bookingengine, .cb-bookingengine-root) .cb-card {
        background: var(--olivea-panel) !important;
        border-radius: 24px !important;
      }

      /* ─────────────────────────────────────────────
         CTA BUTTONS ONLY
         - Buscar (global)
         - Room/action pills ONLY inside .cb-card
      ───────────────────────────────────────────── */

      /* Buscar button */
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        button.cb-search-button {
        background-color: var(--olivea-olive) !important;
        border-color: var(--olivea-olive) !important;
        color: var(--olivea-cream) !important;
        font-family: "Lora", serif !important;
      }
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        button.cb-search-button * {
        color: var(--olivea-cream) !important;
        fill: var(--olivea-cream) !important;
      }
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        button.cb-search-button:hover {
        background-color: #4f6650 !important;
        border-color: #4f6650 !important;
      }
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        button.cb-search-button:active {
        background-color: #445946 !important;
        border-color: #445946 !important;
      }
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        button.cb-search-button:focus-visible {
        outline: 2px solid var(--olivea-cream) !important;
        outline-offset: 2px;
      }

      /* Room/action pills ONLY inside cards */
      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        .cb-card
        :is(button.cb-select-button, button.cb-add-button, button.cb-book-button, button.cb-room-button) {
        background-color: var(--olivea-olive) !important;
        border-color: var(--olivea-olive) !important;
        color: var(--olivea-cream) !important;
        font-family: "Lora", serif !important;
      }

      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        .cb-card
        :is(button.cb-select-button, button.cb-add-button, button.cb-book-button, button.cb-room-button)
        * {
        color: var(--olivea-cream) !important;
        fill: var(--olivea-cream) !important;
      }

      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        .cb-card
        :is(button.cb-select-button, button.cb-add-button, button.cb-book-button, button.cb-room-button):hover {
        background-color: #4f6650 !important;
        border-color: #4f6650 !important;
      }

      .olivea-shell
        :is(#cb-bookingengine, .cb-bookingengine-root)
        .cb-card
        :is(button.cb-select-button, button.cb-add-button, button.cb-book-button, button.cb-room-button):active {
        background-color: #445946 !important;
        border-color: #445946 !important;
      }

      /* ─────────────────────────────────────────────
         THE OLIVE OUTLINE LOOK (as the reservation window's chooser and
         panes): fine olive hairlines instead of grey borders, cream
         instead of grey placeholders, olive instead of black.
         Cloudbeds' class names are hashes that change between releases;
         these rules hold onto its stable hooks only: data-testid
         attributes, its cb-* classes and roles.
      ───────────────────────────────────────────── */

      /* Header: a hairline under it, search pills outlined in olive */
      .olivea-shell [data-testid="header"] {
        border-bottom: 1px solid rgba(94, 118, 88, 0.15) !important;
        box-shadow: none !important;
      }
      .olivea-shell :is(
          [data-testid="header-search-panel-date-picker"],
          [data-testid="landing-search-panel-date-picker"],
          [data-testid="header-search-panel-promocode-button"],
          [data-testid="header-search-panel-filters"]
        ) {
        background: rgba(255, 255, 255, 0.55) !important;
        box-shadow: inset 0 0 0 1px rgba(94, 118, 88, 0.3) !important;
      }

      /* Cards: room, cart, property info */
      .olivea-shell .cb-card {
        border: 1px solid rgba(94, 118, 88, 0.3) !important;
        box-shadow: none !important;
      }
      .olivea-shell hr.chakra-divider {
        border-color: rgba(94, 118, 88, 0.15) !important;
      }

      /* The cart's white box around its card: let the card's outline be the
         only frame. */
      .olivea-shell aside > div:has(> [data-testid="shopping-cart-card"]),
      .olivea-shell aside div:has(> [data-testid="shopping-cart-card"]) {
        background: transparent !important;
        border-color: transparent !important;
        box-shadow: none !important;
      }

      /* Empty cart: the grey bed in olive, the line in italic */
      .olivea-shell [data-testid="shopping-cart-card-empty"] svg path[fill="#BBC0CA"] {
        fill: rgba(94, 118, 88, 0.6) !important;
      }
      .olivea-shell [data-testid="shopping-cart-card-empty"] p {
        font-style: italic !important;
        opacity: 0.8;
      }

      /* A photo that has not arrived yet: cream, not grey */
      .olivea-shell .cb-image-fallback {
        background: rgba(94, 118, 88, 0.08) !important;
        color: rgba(94, 118, 88, 0.45) !important;
      }

      /* "Comparar tarifas": olive, not black. Cloudbeds draws it in a portal
         outside the shell, so this rule is not scoped to it. */
      [data-testid="rate-checker-open-toggle"] {
        background: var(--olivea-olive) !important;
        color: var(--olivea-cream) !important;
        box-shadow: 0 10px 24px -14px rgba(40, 60, 35, 0.7) !important;
      }
      [data-testid="rate-checker-open-toggle"] * {
        color: var(--olivea-cream) !important;
        stroke: currentColor;
      }

      @keyframes olivea-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body>
    <div class="olivea-shell">
      <div class="root">
        <cb-immersive-experience
          property-code="pkwnrX"
          mode="standard"
          lang="es"
          currency="mxn"
        ></cb-immersive-experience>
      </div>
    </div>
    <!-- The reservation window opens this page with ?lang=en on the English
         site. The engine read only the fixed lang="es" above, so English
         guests got "1 Huésped" and "Buscar". Set it before the engine's
         script (deferred) runs. -->
    <script>
      (function () {
        var lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
        var el = document.querySelector("cb-immersive-experience");
        if (el) el.setAttribute("lang", lang);
        document.documentElement.lang = lang;
        if (lang === "en") document.title = "Casa Olivea Reservations";
      })();
    </script>
  </body>
</html>
